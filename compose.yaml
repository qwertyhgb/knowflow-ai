# 本地开发基础设施编排（Docker Compose）。
#
# 【项目名统一说明（2026-08-19）】
# 历史遗留：mysql/redis 容器曾用项目名 knowflow 创建，rabbitmq/elasticsearch 曾用
# 默认项目名 knowflow-ai 创建，导致 docker compose 出现两个项目、卷也分了两套。
# 本文件顶层 name: knowflow 固定项目名，并声明 rabbitmq/es 的数据卷为 external
# 复用旧卷（knowflow-ai_knowflow-*），保证统一项目名后数据（ES 索引、MQ 元数据）
# 不丢失。external 卷 compose 永不自动删除，删除需手动 docker volume rm。
#
# 为什么 RabbitMQ 而非 Kafka（Phase 7 引入 MQ 的技术选型）：
#   - RabbitMQ 的模型（Exchange / Queue / Routing Key / Binding）概念少、上手快，
#     适合当前学习阶段理解「生产-交换机-队列-消费」的完整链路；
#   - Kafka 定位是分布式日志流（分区、offset、重放），概念更多，更适合大数据/流处理场景；
#   - 当前业务只是「上传文档 → 异步解析」这类低频可靠消息，RabbitMQ 足够，
#     后续出现真正的流式场景再评估 Kafka。
#
# 关于 Elasticsearch（Phase 8 引入，负责文档全文搜索）：
#   - 为什么 ES 用独立容器而不是 MySQL：两者是不同生态、拥有独立生命周期的产品。
#     ES 是 JVM 应用（自己的堆内存、磁盘布局、集群模型），MySQL 是关系型存储；
#     两者独立升级、独立扩缩容、独立挂载数据卷才互不干扰——塞进同一个容器只会
#     内存竞争、生命周期耦合，组合编排（compose 按服务隔离）才是各自正确的管理方式。
#   - ES vs MySQL 定位差异（一句话版）：MySQL 是事实源（数据的权威版本），
#     ES 是检索副本（为搜索优化的倒排索引）——同一份文档会以
#     「MySQL 落库 + ES 建索引」双写的方式存在，双写/一致性问题后续步骤专门讲。
#
# 关于 healthcheck（健康检查）：
#   - compose 的 healthcheck 让 Docker 周期性探测服务是否真正就绪，而不仅是进程已启动；
#   - 这里用 rabbitmq-diagnostics ping 探测 RabbitMQ 应用层是否可响应，
#     供依赖方（应用/脚本）等待 healthy 后再连接，避免「容器起来了但服务未就绪」的竞态。
#
# 关于数据卷（volume）：
#   - knowflow-rabbitmq-data 把 RabbitMQ 的持久化数据挂到命名卷，
#     docker compose down/up 或删除容器后消息与元数据仍在；
#     （依赖队列的 durable 与消息的 persistent 才能保证消息落盘，本步先搭好存储底座）
#   - 容器是易失的，数据卷才是数据真正存放的地方——这是 Docker 的核心理念之一。
#
# 手动容器迁移说明：
#   - 此前存在 docker run 手动创建的容器 knowflow-rabbitmq（端口 5672/15672）。
#     docker run 与 compose 管理同一容器名会冲突，必须先停删旧容器，
#     再由 compose 托管（命名卷 + healthcheck 等编排能力是 docker run 没有的）。
#   迁移命令（用户执行，勿由工具代跑）：
#     docker stop knowflow-rabbitmq
#     docker rm knowflow-rabbitmq
#     docker compose up -d rabbitmq
#     docker compose ps   # 等待 rabbitmq 显示 healthy

name: knowflow

services:
  mysql:
    image: mysql:8.4
    container_name: knowflow-mysql
    environment:
      MYSQL_DATABASE: knowflow
      MYSQL_USER: knowflow
      MYSQL_PASSWORD: ${KNOWFLOW_DB_PASSWORD:-knowflow_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-knowflow_root_local_password}
      TZ: UTC
    ports:
      - "${KNOWFLOW_DB_PORT:-3306}:3306"
    volumes:
      - knowflow-mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: knowflow-redis
    ports:
      - "${KNOWFLOW_REDIS_PORT:-6379}:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: knowflow-rabbitmq
    environment:
      # 管理账号：本地开发默认 guest/guest。生产环境必须用环境变量覆盖并改强密码。
      RABBITMQ_DEFAULT_USER: ${KNOWFLOW_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${KNOWFLOW_RABBITMQ_PASS:-guest}
    ports:
      - "${KNOWFLOW_RABBITMQ_PORT:-5672}:5672"
      # 管理界面（Web UI）：浏览器访问 http://localhost:15672 用 guest/guest 登录。
      - "15672:15672"
    volumes:
      - knowflow-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Elasticsearch：文档全文搜索服务。
  # 版本选型依据（与 Spring Data Elasticsearch 的兼容矩阵，教学重点）：
  #   1. pom 添加 spring-boot-starter-data-elasticsearch 后（版本由 Spring Boot 4.1 BOM 管理，
  #      不手写版本号），运行 mvn dependency:tree 实际解析出 spring-data-elasticsearch 6.1.0；
  #   2. 对照官方兼容矩阵（https://docs.spring.io/spring-data/elasticsearch/reference/elasticsearch/versions.html，
  #      2026.0 行），Spring Data Elasticsearch 6.1.x 对应 Elasticsearch 9.4.2；
  #   3. 注意：这里不是 8.x。8.x 系列对应 Spring Data Elasticsearch 5.5.x（2025.0 行，
  #      已标记 out of maintenance）。客户端（SDE 6.1.0）与服务端（ES 8.x）跨大版本
  #      组合不受官方支持，故跟随 BOM 解析出的 6.1.0 选择服务端 9.4.2。
  elasticsearch:
    # 使用自定义 Dockerfile 构建的镜像，预装 IK 中文分词插件。
    # 见 Dockerfile.elasticsearch 注释：为什么要用自定义镜像而非手动安装插件。
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    image: knowflow-elasticsearch-ik:9.4.2
    container_name: knowflow-elasticsearch
    environment:
      # 单节点开发模式：本地学习只需一个节点即可完整使用
      # （单节点自带所有主/数据分片职责，无需发现其他节点）。
      # 生产集群需要多节点 + 真实安全配置，此处配置一律不代表生产形态。
      discovery.type: single-node
      # 本地学习关闭安全认证（免费版默认开启 TLS + 账号密码，徒增学习噪音）。
      # 生产必须开启：xpack.security.enabled=true 并配置密码/证书。
      xpack.security.enabled: false
      # ES 是 JVM 应用：默认堆内存会按宿主机内存的一半分配，
      # 开发机（8G/16G 内存）直接启动会被换页拖垮甚至 OOM，必须显式限制。
      # 512m 仅供本地学习；真实部署需按数据量/分片数另行测算。
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      # 9200 是 REST API 端口（应用与 curl 都通过它访问）；
      # 9300 是节点间传输端口，单节点不需要暴露到宿主机。
      - "${KNOWFLOW_ES_PORT:-9200}:9200"
    volumes:
      - knowflow-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  knowflow-mysql-data:
  # 【external 卷说明】这两个卷在 2026-08-19 之前由「knowflow-ai」项目创建，
  # 数据（ES 索引、RabbitMQ 元数据）都在里面。声明为 external 并显式指定旧卷名，
  # 让统一项目名后的新容器直接复用旧数据；external 卷不会随 compose down 删除。
  knowflow-rabbitmq-data:
    external: true
    name: knowflow-ai_knowflow-rabbitmq-data
  knowflow-es-data:
    external: true
    name: knowflow-ai_knowflow-es-data
