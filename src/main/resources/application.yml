spring:
  application:
    name: knowflow-ai
  profiles:
    default: dev
  jackson:
    time-zone: UTC
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC} %-5level [%thread] %logger{36} - %msg%n"

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

knowflow:
  auth:
    # Token 有效期
    token-ttl: 7d
    # 自动续期阈值：剩余 TTL 不足此值时，认证流程顺带刷新 TTL。
    # 避免每次请求都写 Redis，仅在临近过期时触发。
    token-renew-threshold: 1d
