spring:
  application:
    name: knowflow-ai
  profiles:
    default: dev
  jackson:
    time-zone: UTC
  # 数据库版本管理：应用启动时按序执行 classpath:db/migration 下的迁移脚本。
  flyway:
    # 默认关闭自动 baseline，避免误把未知的非空数据库标记为已迁移。
    # 仅旧库首次接入且确认其结构已等同 V1 时，临时设置环境变量为 true。
    baseline-on-migrate: ${KNOWFLOW_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    locations: classpath:db/migration
  servlet:
    multipart:
      # 上传文件大小上限：Spring Boot 默认 1MB，调整为 10MB 以支持文档上传。
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    # 本地开发默认值，生产由环境变量覆盖（与 knowflow.* 配置风格一致）。
    # guest 账号仅允许 localhost 连接是 RabbitMQ 的安全设计：默认 guest/guest
    # 只能从本机连接，即使凭据泄露也无法从远程直连。
    host: localhost
    port: ${KNOWFLOW_RABBITMQ_PORT:5672}
    username: guest
    password: guest
    listener:
      simple:
        # 监听器重试（stateless 应用内重试，retry.stateless 默认即为 true）：
        # 重试拦截器包住监听器调用，抛异常后在应用进程内反复调用监听方法；
        # 整个重试期间消息在 broker 侧保持 unacked 状态、不离开队列——
        # 与「抛异常 → requeue 回队列再投递」不同：不经过 broker 往返、
        # 不会被其他消费者抢走，队列内消息顺序也不被重试打乱。
        retry:
          enabled: true
          # 「首次尝试之后」的最大重试次数：2 次重试 + 1 次初始尝试 = 共 3 次尝试。
          # 注意 Spring Boot 4 的改名与语义变化：3.x 的 max-attempts 统计「总尝试次数」，
          # 4.0 起改名为 max-retries（max-attempts 已是 error 级弃用项，配置会导致启动失败），
          # 底层接线改用 spring-core 的 RetryPolicy，其 maxRetries 只统计重试次数、
          # 不含首次尝试。要维持「共 3 次尝试」的语义，这里配 2 而不是 3。
          max-retries: 2
          # 第一次重试前的等待时间（毫秒），其后每次等待按 multiplier 递增。
          initial-interval: 1000
          # 指数退避乘数：重试等待依次为 1s、2s、4s（受 max-interval 封顶）。
          # 为什么不用固定间隔立刻重试：若故障源于下游短暂不可用（DB 宕机、网络抖动），
          # 风暴式高频重试成功率低，还会给 broker 和数据库叠加无效负载、拖慢恢复；
          # 逐次拉大间隔，给下游留出恢复时间。
          multiplier: 2.0
          # 重试间隔上限（毫秒），防止指数退避导致等待时间无限增长。
          max-interval: 10000
        # 关键配置：被拒绝的消息默认不重回原队列（Spring Boot 默认值是 true）。
        # 重试耗尽后 recoverer 会拒绝消息；若此项保持 true，消息将被放回 parse-queue，
        # 再次消费、再次失败、再次放回——形成无限 requeue 循环，死信队列永远收不到消息。
        # 设为 false：被拒绝即离开原队列，broker 按 parse-queue 的死信配置
        # （x-dead-letter-exchange，见 MqConfig）把消息转发到 DLX → DLQ 等待人工排查。
        default-requeue-rejected: false
  elasticsearch:
    # ES 客户端连接地址：本地默认值（compose 中 knowflow-elasticsearch），
    # 生产由环境变量覆盖（与 knowflow.* 配置风格一致）。
    # 本步未启用安全认证（compose 中 xpack.security.enabled=false），
    # 故不需要 username/password；生产开启 xpack.security 后需补充
    # spring.elasticsearch.username/password 或 API Key。
    uris: ${KNOWFLOW_ES_URIS:http://localhost:9200}
  ai:
    openai:
      # DeepSeek 的 OpenAI 兼容端点。官方文档推荐写法，不需要 /v1 后缀——
      # Spring AI 的 OpenAI 适配器会自动拼接路径。base-url 指向 DeepSeek
      # 而非 OpenAI 官方，就能用这套配置调用 DeepSeek 的大模型。
      base-url: https://api.deepseek.com
      # API Key 只从环境变量读取，默认空串。
      # 【为什么 key 走环境变量而不写入配置文件/代码？】
      # 这是安全底线：配置文件可能进版本库被泄露，代码也能被反编译。
      # key 属于机密凭据，只允许通过运行环境注入（生产用密钥管理服务），
      # 本地开发用 $env:DEEPSEEK_API_KEY 临时设置，绝不硬编码。
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          # deepseek-chat 是 DeepSeek 通用对话模型，性价比高，适合学习阶段；
          # deepseek-reasoner 是推理模型，性能更强但更贵，以后用到再切换。
          model: deepseek-chat
          # 温度控制采样随机性：0 稳定、1 发散。
          # 客服场景后续会调低以稳定语气，学习阶段 0.7 能直观感受到回答的自然度。
          temperature: 0.7
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC} %-5level [%thread] %logger{36} - %msg%n"

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

knowflow:
  auth:
    # Token 有效期
    token-ttl: 7d
    # 自动续期阈值：剩余 TTL 不足此值时，认证流程顺带刷新 TTL。
    # 避免每次请求都写 Redis，仅在临近过期时触发。
    token-renew-threshold: 1d
  enterprise:
    # 成员邀请有效期：创建邀请时据此计算 expires_at。
    invitation-ttl: 7d
  storage:
    # 本地磁盘存储根目录（学习阶段不引入 MinIO/S3，后续可替换为对象存储）。
    local-dir: ./data/files
  mq:
    # 文档解析消息的 Exchange / Queue / Routing Key 命名。
    # 命名约定：项目前缀（knowflow）.业务域（document）.用途（parse）。
    # Exchange 与 Queue 由 MqConfig 声明式创建，此处仅集中管理名称，便于统一修改。
    parse-exchange: knowflow.document.parse.exchange
    parse-queue: knowflow.document.parse.queue
    parse-routing-key: knowflow.document.parse
    # 死信（Dead Letter）拓扑命名，沿用上面的命名约定。
    # DLX 是死信专用交换器，DLQ 是失败消息的最终落脚点：
    # 重试耗尽被拒绝的消息由 broker 自动转发到这里，等待人工排查。
    parse-dlx: knowflow.document.parse.dlx
    parse-dlq: knowflow.document.parse.dlq
    parse-dlq-routing-key: knowflow.document.parse.dlq