spring:
  application:
    name: knowflow-ai
  profiles:
    default: dev
  jackson:
    time-zone: UTC
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC} %-5level [%thread] %logger{36} - %msg%n"

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

knowflow:
  auth:
    token-ttl: 7d
